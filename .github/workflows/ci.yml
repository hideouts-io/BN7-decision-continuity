name: CI

on:
  push:
    branches: [codex/decision-continuity]
  pull_request:
    branches: [codex/decision-continuity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated Chrome and its runtime dependencies
        run: npx playwright install --with-deps chrome
      - name: Build with strict types
        run: npm run build
      - name: Exercise the real browser workflow and accessibility
        run: npm run smoke
      - name: Rehearse the real loopback source adapter
        run: npm run rehearse:adapter
      - name: Retain synthetic browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-browser-diagnostics
          path: output/playwright/*.png
          if-no-files-found: error
          retention-days: 3
